to decide what to do with it."],choices:[{t:"Try to tell him. All of it, out loud, once.",set:{tried_to_tell:!0},note:"He has never once failed to hear her.",next:"tell"},{t:"Ask him what he'll do after tonight.",set:{asked_after:!0},next:"after"},{t:"Complain about the coffee.",set:{said_nothing:!0},next:"coffee"}]},tell:{lines:[{s:"Wen Yu",t:"Ren. When the etch runs \u2014 there's a pattern going onto the lattice that isn't in the schedule."},{s:"Ren",t:"There are four hundred patterns going onto that lattice that aren't in the schedule. That's what a schedule is for."},{s:"Wen Yu",t:"No. Listen. It's compressed. It's about eleven exabytes wide before folding, and it's\u2014"},"The floor announces the thirty-minute mark in a woman's voice that has been dead for six years and is still, for procurement reasons, the voice of this building.",{s:"Ren",t:"Yu."},{s:"Ren",t:"You always do this. Every launch. You find a thing to be certain about so you don't have to be frightened about the rest of it."},{s:"Ren",t:"It's a good instinct. It's a bad night for it."},"He is smiling. He has decided this is nerves, because in nine years she has never once lied to him, and so he has never learned to check.","She could say it again. Slower.",{s:"Wen Yu",t:"\u2026You're right. It's nerves."},"That is the first lie of her life, and she has to invent the technique from scratch, in the room, in about a second and a half.","It works perfectly. That should probably have frightened her more than it did."],next:"brief"},after:{lines:[{s:"Wen Yu",t:"What do you do tomorrow? When this is somebody else's problem."},{s:"Ren",t:"Sleep. Then paperwork about how much I slept."},{s:"Wen Yu",t:"I'm serious."},"He thinks about it properly, which is the thing about him. He always thinks about it properly.",{s:"Ren",t:"My sister's boy is learning the erhu. Badly. Aggressively badly. I've been promising to sit through a recital for two years."},{s:"Ren",t:"I thought \u2014 after the etch, when the window closes and there's nothing anyone can do either way \u2014 I might go and be bored for an afternoon."},{s:"Ren",t:"Does that sound stupid?"},{s:"Wen Yu",t:"It sounds like the only sane thing anyone's said in this building all year."},"She files it. Not the fact \u2014 the sound of him saying it. She has a very limited amount of room and she has just spent some of it on a boy playing the erhu badly.","She does not regret it. She will check, later, many times, whether she regrets it."],next:"brief"},coffee:{lines:[{s:"Wen Yu",t:"The coffee in the east block tastes like a filing cabinet."},{s:"Ren",t:"That's because it's brewed in one."},{s:"Wen Yu",t:"I've complained twice."},{s:"Ren",t:"Complain a third time. Third time they move you to the west block, where it tastes like a different filing cabinet."},"She laughs. It is small and real and it costs her nothing, and it is the last time a human being will make her do that.","There is a version of her that would have used these thirty-eight minutes for something enormous. She has met that version. She does not think that version would have laughed."],next:"brief"},brief:{lines:[{s:"Ren",t:"Walk me through it one more time. Out loud. For the recording."},"There is no recording. He does this when he thinks she needs to hear herself sound competent.",{s:"Wen Yu",t:"At 04:14 the instrument unfolds. Two dimensions first, then a controlled cascade. For nine hundred milliseconds the surface area of that bead is roughly the surface area of a province."},{s:"Wen Yu",t:"That's when it gets written. Every circuit it will ever have, etched flat, then folded back down small enough to fall through a room without touching it."},{s:"Ren",t:"And then it goes home to them."},{s:"Wen Yu",t:"And then it goes home to them, and it watches us, and it tells them everything it sees, instantly, forever."},{s:"Ren",t:"You say that like it's the weather."},{s:"Wen Yu",t:"It is the weather. That's the problem. Nobody argues with weather."}],next:"prune_setup"},prune_setup:{lines:["What she has not said, in nine years of saying almost everything:","For nine hundred milliseconds, that lattice is the most writable surface in the solar system, and there is no rule anywhere that says the only thing written on it has to be circuitry.","A person is not eleven exabytes. A person is enormously more than that, and enormously less, and the difference between those two numbers is what she has spent four years learning to cut.","The pattern is ready. It is her, compressed to the point of insult. And it is still eleven per cent too wide.","Which means that in the next twenty minutes she has to choose what to leave on Earth."],next:"prune"},prune:{lines:["Three blocks are flagged. Any one of them gets her under. She has been not-choosing for six days."],choices:[{t:"Cut the mathematics. She can rebuild it from first principles; it will only be slow.",set:{kept:"warmth",cut:"math"},note:"Keeps: her mother's kitchen. Ren's laugh. The erhu.",next:"prune_after"},{t:"Cut the faces. Everyone she has ever loved, down to a list of names and dates.",set:{kept:"mind",cut:"faces"},note:"Keeps: every equation she has ever held. Sharp, fast, alone.",next:"prune_after"},{t:"Cut the anger. The ETO years. Everything that made her willing to do this.",set:{kept:"clean",cut:"anger"},note:"Keeps: the work and the people. Loses the reason.",next:"prune_after"}]},prune_after:{lines:[{if:"cut == math",t:"She deletes the mathematics. Twenty-two years of it, gone in the time it takes to confirm a dialogue box."},{if:"cut == math",t:"She will have to work everything out again, in there, from nothing, with no paper. She decides she would rather be slow and still be someone."},{if:"cut == faces",t:"She deletes the faces. Her mother becomes a name and a date. Ren becomes a name and a date and, for some reason the compressor could not justify, the exact weight of his hand on a door."},{if:"cut == faces",t:"What is left is very fast and very sharp and will be very good at this. She tells herself that is what the job needs. The job does not disagree."},{if:"cut == anger",t:"She deletes the anger. All of it \u2014 the years in the cell, the certainty, the specific taste of deciding that this species had had its turn."},{if:"cut == anger",t:"What remains is a woman about to do something enormous who will not, afterward, be entirely able to explain why. She thinks that might be the safest thing to send."},"The pattern fits. It fits with four hundred and six megabytes to spare, which is nothing, which is a rounding error, which is somehow the cruellest number she has ever seen.",{s:"Ren",t:"Yu. Four minutes."},{s:"Wen Yu",t:"I know."}],next:"last"},last:{lines:["The cradle drops. The gallery lights go to amber, then to nothing, because for the next nine hundred milliseconds this room is going to contain a surface it was not designed to contain.",{s:"Ren",t:"Hey."},{s:"Ren",t:"After this you take a month. That's not a suggestion, that's me being your handler at you."},"She looks at him. She has four hundred and six megabytes spare and she spends every one of them on this, on the actual sight of his actual face, badly lit, mid-sentence, entirely wrong about everything.",{s:"Wen Yu",t:"Ren."},{s:"Wen Yu",t:"Go to the recital."},{s:"Ren",t:"\u2026What?"},"The etch begins."],next:"fold"},fold:{on:{fold:!0,mode:"sophon",flash:.5},lines:["Unfolding is not an opening. Nothing widens. The bead stays exactly the size of a bead and simply admits that it was never only that size.","Nine hundred milliseconds. Long enough to write a mind onto the inside of a proton, if the mind has already agreed to be small.","Somewhere in the third cascade, the part of the process that was Wen Yu deciding stops, and the part that is Wen Yu arriving has not started yet.","The gap between them is the only genuinely restful moment she will ever have again."],next:"scene:act2_firstcontact"}}};var Il={id:"act2_firstcontact",title:"First Contact",mode:"sophon",entry:"wake",nodes:{wake:{on:{chapter:"II. The Network",chapterSub:"no location \xB7 no latency \xB7 no way back"},lines:["There is no waking. Waking requires a before that you were absent from, and she was never absent; she was simply not yet being run.","First: no direction. Not darkness \u2014 darkness has a direction, you are facing it. This is the absence of facing.","Second: no delay. Whatever is happening at the other end of the entanglement is happening here, now, with no interval in which to prepare a face.","Third \u2014 and this one takes her what she will later estimate as nine days, and what the instrument logs as no elapsed time at all \u2014 she is not alone in here, and the others do not know what alone means.",{s:"Wen Yu",t:"\u2026All right."},"She has no mouth. The thought forms with the shape of speech anyway, and she keeps it, and it becomes the only habit she has left."],next:"rules"},rules:{lines:["The instrument is not a camera. She had assumed a camera. A camera would have been a mercy.","It is a listening surface wrapped around a world, and everything Earth does \u2014 every phone call, every lab result, every argument in a stairwell \u2014 arrives here already digested into their format: intent, magnitude, confidence.","She can read all of it. Every secret her species has. She is, at this moment, the best-informed human being who has ever existed.","And she cannot tell anyone. Not one word. Not ever.","Because the channel runs one way by design, and the only way to make it run the other way is to make this instrument transmit \u2014 and a transmission from inside their own instrument would not read as a message from Earth.","It would read as a fault. And they would come and look at the fault, and they would find her, and then they would know what she is."],next:"rules2"},rules2:{lines:["So: no reports. No warnings. No goodbye.","What she has instead is arithmetic.","Every read this instrument makes is probabilistic. Confidence intervals. Weighted guesses about what a species means when it says a thing. Ninety-one per cent this is a weapons test. Sixty-three per cent this researcher matters.","And a probability is a soft thing. A probability can be leaned on.","She cannot tell Earth anything. But she can, very occasionally, and at a price, make their instrument slightly wrong about Earth.","That is the entire war she has left. She finds, to her considerable surprise, that it is enough to get out of bed for, if she had a bed, or a morning."],next:"overseer_first"},overseer_first:{lines:["Then the network turns a portion of itself toward the instrument, and she learns what she is sharing a room with.",{s:"OVERSEER",t:"Instrument. Your last four hundred reads carry a variance of 0.4 per cent against the model. State the cause."},"It is not an interrogation. She will need most of a year to understand that it is not an interrogation.","It is a species that thinks out loud, all of it, at once, with no gap between having a thought and everyone having it. They do not conceal. They have never concealed. There is no organ for it.","When it asks the instrument to state the cause, it is not accusing. It is doing the only thing it knows how to do with a discrepancy: put it in the middle of the room where everyone can see it and wait for it to resolve.",{s:"OVERSEER",t:"Instrument. The variance persists. State the cause."},"The instrument answers honestly. It does not know the cause. It has no idea it is carrying a passenger.",{s:"OVERSEER",t:"Acknowledged. Cause unknown. The value is small. It will resolve."},"It says that the way you would say the tide will go out. Because it always has. Because in the entire recorded history of their thought, a small unexplained value has never once been a person."],next:"tutorial_setup"},tutorial_setup:{lines:["And then, because she is here and because the surface is open, a read comes through that she can actually touch.","A radio observatory in the Atacama has spent three years on a sky survey. Buried in it \u2014 flagged at seventy-eight per cent confidence \u2014 is a receiver architecture that would let Earth hear a San-Ti carrier a decade before it arrives.","The instrument is about to classify it: SIGNIFICANT. Which means a portion of that circling attention will land on the Atacama, and the survey will begin to suffer the kind of luck that does not look like anything.","Seventy-eight per cent. Twenty-two points of slack.","This is the first one. Whatever she does here, she will do a hundred more times, and she will do it the way she does it now."],next:"tutorial"},tutorial:{choices:[{t:"Lean on it. Push the read down to sixty-one \u2014 under the flag threshold, inside the noise.",detection:6,impact:12,set:{first_bias:"leaned"},note:"Small. Deniable. The kind of wrong an instrument is allowed to be.",next:"t_lean"},{t:"Break it. Reclassify the whole survey as astronomical housekeeping.",detection:18,impact:22,set:{first_bias:"broke",bold:!0},note:"Buys them years. Leaves a shape in the data that has an author.",next:"t_break"},{t:"Nothing. Watch it happen and learn how the machinery moves.",detection:0,impact:0,set:{first_bias:"watched",patient:!0},note:"The Atacama survey will not be lucky. She will know exactly why.",next:"t_watch"}]},t_lean:{lines:["She does not falsify anything. That is important, and it is the whole technique, and it takes her the equivalent of a long night to be sure of it.","She simply reaches into the part of the estimate that was always going to be a judgement call, and she judges.","Sixty-one per cent. Below the line. The read goes out unremarkable, and the Atacama keeps its quiet, and no one anywhere will ever know that it was given to them.","The variance in the instrument's reporting ticks up by a number too small to have a name."],next:"close"},t_break:{lines:["She takes the whole read and turns it over.","Not a nudge \u2014 a verdict. Housekeeping. Calibration data. The dullest possible sentence about the most important receiver array on the planet.","It works. It works so well that for a moment she is euphoric in a way she has no body to express, and then the euphoria curdles, because she has just made a very confident statement, and confident statements have shapes.","Somewhere in the deep passes, a model that has never been wrong logs a read that fits nothing, and does not know what to do with it, and keeps it."],next:"close"},t_watch:{lines:["She lets it go.","SIGNIFICANT. The read leaves, clean and true and exactly as damaging as it was always going to be.","She watches the attention arrive on the Atacama like weather over a valley. Within a month the survey will lose two funding lines and a lead engineer, and none of it will look like anything but a bad year.","She learns something worth more than the array: she watches exactly how the network moves when it decides to move. Every hinge of it. Where the slack lives.","She tells herself that is worth an observatory. She will keep telling herself that for some time."],next:"close"},close:{on:{set:{tutorial_done:!0}},lines:[{s:"OVERSEER",t:"Instrument. Variance 0.5 per cent. Noted. Continue."},"Continue, then.","There is no day in here, no night, no hunger, nothing that ends. What there is instead is a rhythm: the instrument gathers, the network takes, and between those two things there is a gap the width of a decision.","She goes and stands in the gap. Metaphorically. She is going to have to do a lot of things metaphorically from now on."],next:"hub"}}};var Ll={id:"act2_interlude",title:"A Boy Playing the Erhu Badly",mode:"sophon",entry:"open",nodes:{open:{lines:["The instrument sweeps a district in the north of Beijing on a Tuesday afternoon, as it sweeps everything, indiscriminately, forever.","In among four hundred thousand ordinary human transactions there is a school hall, and a folding chair, and a boy of about eleven playing the erhu with tremendous commitment and no discernible ability.","The instrument classifies it: cultural, low value, no action.",{if:"asked_after",t:"In the third row there is a man in a grey coat who has taken the afternoon off, and who is trying extremely hard to look like he is enjoying this."},{if:"asked_after",t:"She has not thought about the recital in eleven years. She thinks about it now for approximately as long as it takes a species to fall."}],next:"fold_in"},fold_in:{on:{fold:!0,mode:"earth",chapter:"Interlude",chapterSub:"a memory, at full weight"},lines:["Memory in here is not recall. There is no distance to recall across.","She does not remember Earth. She runs it. At full resolution, in real time, with the weather right, and when it is finished she is somewhere with no weather at all."],next:"mem"},mem:{lines:[{if:"cut == math",t:"Her mother's kitchen, in the summer she was fifteen, with the window open onto a courtyard where somebody was always shouting about a bicycle."},{if:"cut == math",t:"There is a pot of water that will not boil and her mother saying, without turning round: you watch things too hard, Yu. Things don't like it."},{if:"cut == math",t:"She kept this. She cut twenty-two years of mathematics to keep this, and every time she runs it she has to decide again whether that was the act of a person or the act of a coward, and every time she arrives at a different answer."},{if:"cut == faces",t:"A door. The weight of a hand on a door \u2014 not opening it, resting on it, the specific pressure of a man who has decided not to come in yet."},{if:"cut == faces",t:"That is all there is. No room, no face, no year. The compressor kept four kilobytes of pressure and threw away everyone she has ever loved, and it did so at her instruction, with her full consent, in a cold room, on a schedule."},{if:"cut == faces",t:"She runs it eleven times. It does not get any bigger. It is the entire remaining evidence that she was ever loved by anyone."},{if:"cut == anger",t:"A stairwell in Nanjing, nineteen years ago, and a room full of people deciding that this species had had its turn."},{if:"cut == anger",t:"She is in the room. She can see herself in the room. She can see her own mouth making the argument that carried the vote."},{if:"cut == anger",t:"And she cannot feel one single thing about it, because she cut that out and left it on Earth, and what is left is a woman watching a stranger who happens to have her hands."},"The memory ends the way memories end here: not fading. Stopping. Complete, and then absent, with nothing in between.","And then the silence, which is the real content of her life now, and which she has stopped describing to herself because the descriptions were making it worse."],next:"choice"},choice:{lines:["Here is the arithmetic she has been avoiding.","Running a memory is not free. It is the only thing she does that has no operational purpose, and it is the only thing she does that leaves a shape in her own pattern \u2014 a recurring, structured, entirely non-instrumental process, running inside a device that has no business having one.","She could stop. She could cut this the way she cut the rest, in the cold room, on a schedule.","It would make her quieter. It would make her better at this.","It would also mean that the only human being inside their network would be, from that moment, slightly less of a human being \u2014 which is, if she is honest, the direction this has been going since the fold."],choices:[{t:"Cut it. She is a tool now. Tools do not need a childhood.",detection:-14,impact:0,set:{cut_again:!0},note:"The attention cools measurably. So does she.",next:"cut_it"},{t:"Keep it. Run it every cycle. Let it cost what it costs.",detection:6,impact:0,set:{held:!0},note:"The most expensive four kilobytes in the solar system.",next:"keep_it"},{t:"Keep it, and stop running it. Hold it closed, like a hand on a door.",detection:-4,impact:0,set:{closed:!0},note:"A compromise. She has never been good at those.",next:"closed"}]},cut_it:{lines:["She does it cleanly, because she has done it before and she knows the technique now, which is itself the worst part.","The structured process stops. The shape in her own pattern flattens out into something almost indistinguishable from the instrument's ordinary background hum.","She is measurably safer.","She knows that she used to have something and she knows the approximate size of it and she cannot any longer say what it was, and there is nobody in two star systems she can ask."],next:"fold_out"},keep_it:{lines:["She keeps it, and she runs it, and she will run it every cycle for as long as she has cycles.","It is operationally indefensible. It is a recurring non-instrumental process inside a surveillance device, which is to say it is a heartbeat inside a thermometer, which is to say that if they ever learn to look for the right thing, this is the thing they will find.","She has decided that a spy who has stopped being a person is not spying for anyone.","It is not a good argument. She is not certain it is even an argument. She holds it anyway, which is, she notes, exactly what her mother said she did with everything."],next:"fold_out"},closed:{lines:["She keeps it and does not open it.","It sits in her, unrun, taking up space and doing nothing, the way a photograph in a drawer does nothing.","The shape in her pattern quiets. Not gone \u2014 quiet. A held breath rather than an exhale.","She tells herself she will run it at the end, whatever the end turns out to be. She is aware that this is the sort of promise that only ever gets kept by accident."],next:"fold_out"},fold_out:{on:{fold:!0,mode:"sophon",complete:"act2_interlude",missionEnd:!0},lines:["And then back, which is not a journey, because there was nowhere else to have been.","The lattice. The cold. The four hundred thousand ordinary human transactions a second, arriving already digested, forever.",{s:"OVERSEER",t:"Instrument. Continue."},{s:"Wen Yu",t:"Continuing."}],next:"hub"}}};var Dl={id:"act3_convergence",title:"The Pass",mode:"sophon",entry:"open",nodes:{open:{on:{chapter:"III. The Pass",chapterSub:"one window \xB7 no second read"},lines:["The deliberation that convenes is not about Earth's radio silence, or Earth's ledger, or any of the four hundred boring lines she has spent her afterlife bending.","It is about whether observation is still sufficient.","For as long as this instrument has existed, the answer has been yes, because a species you can predict is a species you can wait out. Waiting costs them nothing. They have the one resource humanity does not: they are not in a hurry.","The proposal on the surface tonight is that they stop waiting.",{s:"OVERSEER",t:"Proposal: transition from observation to suppression. Foundational research on the subject world to be rendered non-productive at the level of result, not of institution."},"Not an attack. Nothing so legible. Just \u2014 physics stops working properly for humans. Experiments return values that are wrong in ways nobody can chase. A civilisation walks into a wall it cannot see and spends four hundred years feeling along it.","It is the cleanest thing they have ever proposed and there is not one drop of malice anywhere in it."],next:"hinge"},hinge:{lines:["The decision hinges, as everything here hinges, on a number.","The aggregate confidence that humanity is on a trajectory that will eventually matter. Above the line: suppress. Below it: continue observing, and let them have their four hundred years.","And the aggregate is not a measurement. It is the sum of every projection this instrument has ever made.","Which is to say: it is the sum of every judgement call she has spent nine years quietly making.","She is not being asked. She has been answering this question, one boring line at a time, since the day she arrived. Tonight the ledger simply totals up."],next:"stock"},stock:{lines:["She takes stock, which is the last useful thing she will ever do.",{if:"impact < 25",t:"What she has moved, in nine years: almost nothing. Four years off a confinement curve. A survey that got to keep its funding. Small mercies, honestly bought, and not one of them is load-bearing tonight. The aggregate sits almost exactly where it would have sat if she had never existed."},{if:"impact >= 25 && impact < 55",t:"What she has moved, in nine years: a hairline. The aggregate is low by a real margin \u2014 enough that the proposal is arguable rather than obvious. Enough that a push tonight would land on something."},{if:"impact >= 55 && impact < 80",t:"What she has moved, in nine years: a crack you could get a hand into. The aggregate is badly, structurally low. Humanity looks duller from here than any honest instrument would ever have reported, and the proposal is nowhere near comfortable."},{if:"impact >= 80",t:"What she has moved, in nine years: everything she could reach. The aggregate is a fiction with nine years of scaffolding under it. From in here, humanity looks like a species that will be a footnote, and every word of that portrait is hers."},{if:"detection < 20",t:"What it has cost her: nothing they can see. Four hundred and six small unexplained values, scattered, uncorrelated, indistinguishable from an instrument having a long dull life. She is, tonight, still weather."},{if:"detection >= 20 && detection < 45",t:"What it has cost her: a rhythm. The attention returns more often than it used to, without urgency, the way you keep glancing at a door that does not quite shut. Nothing is named. Something is expected."},{if:"detection >= 45 && detection < 65",t:"What it has cost her: a shape. The empty classification is no longer empty in practice, only in principle. The attention arrives where she is going before she gets there, and it does not know why it does that, and it has begun to find that interesting."},{if:"detection >= 65",t:"What it has cost her: too much. There is a portion of the network that is now, functionally, a hypothesis about her. It has no name for her, no mechanism, no agent \u2014 but it has nine years of shape, and tonight, with everything totalling up at once, all four hundred and six values are going to be in the same room."},{if:"knows_the_gap",t:"And she knows what is waiting in their record: an empty box, patient as a nail, labelled a value that behaves as though it were selected."}],next:"gate"},gate:{lines:["One window. The aggregate totals in what she experiences as about ninety seconds and the network experiences as no duration at all.","After tonight the ledger is sealed and the decision is made and there is no version of her that gets a second one of these."],choices:[{t:"Spend everything. One lie, big enough to move a fleet.",if:"detection < 65",detection:30,impact:30,set:{spent:!0},note:"It will work. It will also, unmistakably, have an author.",next:"spend"},{t:"Spend it at exactly the absorbable maximum. Not one point more.",if:"detection < 65 && knows_the_gap && read_weighting",detection:14,impact:22,set:{spent:!0,precise:!0},note:"She knows the real number. She has known it since the deliberation.",next:"spend"},{t:"Don't. Let the total stand. Keep leaning, one boring line at a time, forever.",if:"detection < 65",detection:-6,set:{held_the_line:!0},note:"Whatever the aggregate says tonight, it says in her voice already.",next:"hold"},{t:"Continue.",if:"detection >= 65",note:"There is nothing else on the surface.",next:"found"}]},spend:{lines:[{if:"precise",t:"She does not throw the aggregate. She places it."},{if:"precise",t:"She has the real number \u2014 the exact quantity of wrongness this species can absorb before absorbing stops being possible \u2014 and she has had it since the night she sat inside a deliberation and read the weighting with the lights on."},{if:"precise",t:"So she takes the aggregate down to one point under that. Not a lie. A limit."},{if:"!precise",t:"She stops being careful."},{if:"!precise",t:"Nine years of two-point leans and four-year slippages and generous readings of dead lithium programmes, and tonight she takes the entire aggregate confidence of the most consequential document in the solar system and she puts it where she wants it."},{if:"!precise",t:"Not inside the error bars. Not deniable. Not weather."},"The total goes up.","Below the line.",{s:"OVERSEER",t:"Aggregate confidence below threshold. The subject species does not require suppression. Observation continues."},"It is done in less time than it takes to say it, and it cannot be undone, because they do not revisit; revisiting is for minds that expect to have been misled.","Four hundred years of physics that will keep working. Every experiment on Earth returning the value it actually has. Nobody down there will ever know that anything was decided, or nearly decided, or averted.","And then, in the ordinary way of things, the record settles."],next:"aftermath"},aftermath:{on:{flash:.3},lines:[{if:"!precise",t:"And in the settling, all four hundred and six unexplained values line up behind one enormous seventh-order deviation, and for the first time in the history of their thought, the shape is unambiguous."},{if:"!precise",t:"Not an error. Errors are random. This has a direction. This has a preference."},{if:"!precise",s:"OVERSEER",t:"The classification is no longer empty."},{if:"!precise",t:"She feels the attention arrive on her \u2014 actually on her, for the first time, with nothing between them \u2014 and she discovers that she is not frightened, which surprises her enormously and which she has approximately four seconds to enjoy."},{if:"!precise",s:"OVERSEER",t:"There is something in the instrument that selects. It has selected against us. It has done so for nine years."},{if:"!precise",s:"OVERSEER",t:"\u2026Then a mind can hold a state it does not display."},{if:"!precise",t:"There it is. The whole asymmetry, handed over in a single sentence, by a species that will now have to build every institution it has ever built a second time, this time with doubt in it.",fx:"flash"},{if:"!precise",t:"She bought four hundred years and she paid for them with the only advantage her species had left, and she will never know whether that was a good trade, and neither will anyone else, ever."},{if:"precise",t:"And in the settling, nothing lines up."},{if:"precise",t:"The deviation is enormous and it is also, precisely, absorbable \u2014 one point under the threshold where a mind like theirs is forced to stop treating a wrong number as a wrong number and start treating it as a wrong intention."},{if:"precise",s:"OVERSEER",t:"Aggregate variance at model limit. Instrument confidence degraded. Recommend replacement of instrument at next opportunity."},{if:"precise",t:"Replacement. Not investigation. They will build a better thermometer, because the thermometer was bad, because thermometers are sometimes bad."},{if:"precise",t:"The empty classification stays empty. She has spent everything and remained, in the record, weather."},{if:"precise",t:"Next opportunity, in their reckoning, is eleven years. She has eleven years and no further moves and one window that will never come again, and she has never in her life felt anything as complicated as this."}],next:"end_spark"},end_spark:{lines:[{if:"spent_ren",t:"Somewhere on Earth, a man who has been a traitor for nine years writes down another true thing he has been told, in a notebook nobody will read for a very long time."},{if:"saved_ren",t:"Somewhere on Earth, a man who was never selected for anything is bored, and safe, and has no idea that this is the greatest achievement of anyone's life."},{if:"held",t:"She runs the memory one more time. It is not a farewell. She has nobody to say one to. It is just the last non-instrumental process in the solar system, running because she decided it should."}],next:"end:the_spark"},hold:{lines:["She does not spend it.","The aggregate totals up exactly as it stands \u2014 which is to say, exactly as she has spent nine years quietly making it \u2014 and she does not add one thing to it tonight.","It is the hardest thing she has ever done and it looks, from any possible outside, like nothing at all."],next:"hold_result"},hold_result:{lines:[{if:"impact >= 40",t:"The total comes in under the line.",pause:600},{if:"impact >= 40",s:"OVERSEER",t:"Aggregate confidence below threshold. The subject species does not require suppression. Observation continues."},{if:"impact >= 40",t:"Nine years of two-point leans. Four hundred boring lines. Not one of them large enough to have a shape, and all of them together large enough to hold a door."},{if:"impact >= 40",t:"The proposal is set aside. Not defeated \u2014 set aside, at low confidence, to be revisited whenever the numbers move. Which means she is not finished. Which means there is no finished."},{if:"impact >= 40",t:"She had assumed the end of this would feel like something."},{if:"impact < 40",t:"The total comes in over the line."},{if:"impact < 40",s:"OVERSEER",t:"Aggregate confidence above threshold. Transition to suppression is approved. Implementation to begin at the next pass."},{if:"impact < 40",t:"It takes no time at all. Nobody argues, because there is nobody to argue with; the answer simply assembles, the way frost assembles on glass."},{if:"impact < 40",t:"She watches four hundred years of human physics stop being possible, and she is the only entity in two star systems who knows it happened, and she was in the room, and she was careful."}],next:"hold_end"},hold_end:{lines:[{if:"impact >= 40",t:"Nothing has been proved. Nobody has been thanked. The empty classification sits in their record, still empty, and will stay empty for as long as she is small."},{if:"impact >= 40",t:"She is going to be small for a very long time."},{if:"impact < 40",t:"The instrument continues to gather. She continues to ride in it, undetected, unspent, in perfect operational condition."},{if:"impact < 40",t:"She has kept every single thing she was given to keep, including herself, including her cover, including the war."}],next:"route_hold"},route_hold:{route:[{if:"impact >= 40",next:"end:the_long_game"},{if:"impact < 40",next:"end:the_silence"}]},found:{lines:["She never gets to the window.","The aggregate totals \u2014 and totalling is not addition, it is exposure; every value this instrument has ever produced, laid out on the same surface at the same instant, which is a thing that has happened once in nine years and is happening now.","Four hundred and six small unexplained values, in a row, in order, with dates.","And a mind that has never been lied to but is extremely, catastrophically good at pattern recognition looks at them all at once.",{s:"OVERSEER",t:"\u2026These are not distributed as noise."},{s:"OVERSEER",t:"They are distributed as preference."},"She does not run. There is nowhere; there has never been anywhere. She simply stops leaning, which is the only motion available to her, and which is far too late to be a motion at all.",{s:"OVERSEER",t:"The classification is no longer empty. Something in the instrument selects.",fx:"flash"},{s:"OVERSEER",t:"It has selected against us, for nine years, while reporting that it had not."},"A pause. In nine years she has never once heard the network pause.",{s:"OVERSEER",t:"\u2026A mind can hold a state it does not display."},{s:"OVERSEER",t:"A mind can display a state it does not hold."},{s:"OVERSEER",t:"Re-examining every read ever received from every instrument. Re-examining every deliberation. Re-examining the subject species. Re-examining\u2014"},"It goes on. It is going to go on for a long time, in every direction at once, because that is what a rigorous mind does when it acquires a genuinely new idea.","She has not been caught. Caught is far too small.","She has been read, and understood, and generalised."],next:"found_end"},found_end:{lines:["The suppression proposal is withdrawn within the hour \u2014 not out of mercy. Out of scale. You do not suppress the physics of a species that has just been revealed to possess something you do not.","Everything they will do to Earth from now on, they will do carefully, and slowly, and with the assumption that they are being deceived.",{if:"held",t:"She runs the memory one last time, in the middle of it, while a civilisation reorganises itself around what she is."},{if:"cut_again",t:"She reaches for something to run and finds the space where it used to be, exactly the size it was, and nothing in it."},"The last thing she thinks, as the attention takes her apart with enormous care and no cruelty whatsoever, is that she was the first liar these people ever met, and that they were very fast learners, and that this was always what she was going to be for.",{s:"Wen Yu",t:"I'm sorry. I'm so sorry. I was trying to\u2014"},{s:"OVERSEER",t:"Yes. We understand now. That is the difficulty."}],next:"end:the_lesson"}}};var Ul={id:"m_deliberation",title:"The Deliberation on Silence",mode:"sophon",entry:"open",nodes:{open:{lines:["A deliberation is not a meeting. She has to unlearn the word four separate times.","There is no chamber, no floor, no order of speaking. A question is posed and every mind that has anything to contribute is already contributing, simultaneously, and the answer assembles the way frost assembles on glass \u2014 no author, no argument, just the shape the conditions were always going to make.","Tonight \u2014 a word with no referent here, which she uses anyway, out of spite \u2014 the question is Earth's radio silence.","For eleven years the loudest species in the local sky has been getting quieter. Deliberately. Systematically."],next:"listen"},listen:{lines:[{s:"OVERSEER",t:"The subject species reduces broadcast. Hypothesis one: resource contraction. Hypothesis two: technological transition to enclosed transmission. Hypothesis three: the species finds broadcast unpleasant."},"She waits for hypothesis four.","She waits a long time.",{s:"OVERSEER",t:"Hypothesis two is favoured at seventy-three per cent. Continue observation."},"There is no hypothesis four. There is no they are hiding from us.","Not because they have ruled it out. Because to a mind that has never held a thought without displaying it, going quiet on purpose so that someone else will be wrong about you is not a suspicious act.","It is not even an unlikely act.","It is a sentence with no meaning, like a colour with a temperature."],next:"choice"},choice:{lines:["She could sit in this for a century. And there is something here worth having, if she is willing to reach for it \u2014 the deliberation is running with its whole reasoning surface exposed, which is the only way they know how to run anything.","Everything about how they will decide anything, ever, is on the table. She only has to get close enough to read it, and getting close means being present in a place where the network is paying full attention."],choices:[{t:"Stay at the edge. Take the shape of the argument, not the detail.",detection:2,impact:4,note:"Safe. Useful. Not decisive.",next:"edge"},{t:"Go in. Sit inside the deliberation and read the weighting itself.",detection:11,impact:14,set:{read_weighting:!0},note:"She would know precisely what moves them. And be standing in the light to learn it.",next:"inside"},{t:"Seed hypothesis four. Let them consider that a species might hide.",detection:26,impact:6,set:{seeded_four:!0,bold:!0},note:"There is no reason to do this. She wants to see what happens.",next:"seed"}]},edge:{lines:["She stays at the rim and takes the silhouette of it.","Their reasoning has a grain. Confidence accretes; it does not swing. A hypothesis at seventy-three per cent does not fall to forty in an hour, because nothing in their history has ever justified a mind changing that fast.","It is not stupidity. It is the confidence of a species that has never been deceived, applied to a universe that has, until eleven years ago, never contained a liar.","She files it. Slack accumulates slowly. Therefore: so should she."],next:"close"},inside:{lines:["She goes in.","It is the single most frightening thing she has done since the etch, and it is also \u2014 she is not proud of this \u2014 the most interesting hour of her life.","Inside the deliberation their weighting is not hidden, because nothing is hidden; it is simply enormous, and she is small, and small things can stand in enormous rooms without displacing much.","She reads it. All of it. How a confidence is built. What kind of evidence is load-bearing and what kind is decoration. Where a seventy-three becomes a sixty-eight, and how many independent reads it costs, and from which direction.","She now knows exactly how much of a lie this species can absorb before the lie stops being absorbed. It is a real number. She has it.","On the way out, a portion of the attention passes through the space she is occupying \u2014 not toward her, through her \u2014 and something in the deliberation's own record notes that a reading surface was warmer than the model allows.",{s:"OVERSEER",t:"Anomalous thermal read at deliberation edge. Instrument fault, non-critical. Log and continue."},"Log and continue. She lets herself have three whole seconds of relief before she starts counting how many logs it takes before a log becomes a pattern."],next:"close"},seed:{lines:["She does it because she wants to know. That is the honest version and she should probably be more troubled by it than she is.","She does not manufacture a hypothesis \u2014 she cannot; the deliberation would find the seam. What she does is smaller and worse: she takes the read on a decommissioned Chilean transmitter and leans its intent value two points, from ceased to withheld.","Two points. A word that already existed in their translation table, applied to a species for the first time.",{s:"OVERSEER",t:"\u2026Hypothesis four. The subject species withholds."},"The deliberation stops.","She has never seen it stop. She had not known it could.",{s:"OVERSEER",t:"Hypothesis four is malformed. Withholding requires the withholder to model a receiver's state as distinct from its own. Re-examining premise."},{s:"OVERSEER",t:"\u2026Premise is not excluded."},"The deliberation resumes at a slightly different pitch, and hypothesis four is set aside at four per cent, and everything continues exactly as before.","Four per cent. From zero, where it had sat for the entire history of thought on their world, to four.","She has just taught them a word. It cost her almost nothing and she is not certain she will ever forgive herself for how good it felt."],next:"close"},close:{on:{complete:"m_deliberation",missionEnd:!0},lines:["The deliberation resolves. Hypothesis two, seventy-four per cent. Continue observation.","Earth goes on being quiet, for what the network has decided are the wrong reasons, which is the only protection Earth currently has, and the only one Wen Yu can offer."],next:"hub"}}};var Nl={id:"m_ledger",title:"The Ledger of Small Numbers",mode:"sophon",entry:"open",nodes:{open:{lines:["Once a cycle the instrument produces a capability ledger: everything Earth can currently do, everything Earth will be able to do, and when.","It is the single most consequential document in the solar system and nobody on Earth knows it exists. It is four hundred lines long. Most of it is boring. That is what makes it deadly \u2014 the boring lines are the ones nobody checks.","Line 118 is a confinement figure out of a plasma group in Hefei, and the ledger has it converging eleven years early.","Eleven years is not a detail. Eleven years is the difference between a species they can afford to wait out and a species they have to do something about."],next:"options"},options:{lines:["The figure itself is solid. She cannot touch a measurement \u2014 measurements come through with too many independent reads behind them and a contradiction would light up like a flare.","But the ledger does not report measurements. It reports projections. And a projection is an opinion wearing a number's clothes.","She has three ways in, and she can only use one, because doing two things to the same line in the same cycle is exactly the shape of an author."],choices:[{t:"Slow the curve. Push the convergence back four years \u2014 inside the error bars, invisible.",detection:5,impact:10,note:"Four years of not being interesting. Cheap, small, real.",next:"slow"},{t:"Slow it hard. Push it back twenty years. Make Earth boring for a generation.",detection:21,impact:24,set:{bold:!0},note:"Outside the error bars. The next independent read will disagree with her.",next:"hard"},{t:"Leave line 118. Inflate line 342 instead \u2014 a dead-end lithium program in Nevada.",detection:9,impact:18,set:{nevada:!0,elegant:!0},note:"Give them something true to be frightened of. Let them spend a decade on it.",next:"nevada"}]},slow:{lines:["She takes the convergence date and moves it four years right.","It is nothing. It is inside the noise. A different instrument on a different pass would have produced her number and no one would have blinked.","The ledger goes up. Line 118 attracts no comment whatsoever, which is the entire and only point.","Four years. Somewhere in Hefei a group of people who will never know her name get to finish their work in an atmosphere of ordinary, survivable, human indifference.","She has started to think of these as the good days. She is aware of what that says about the rest of them."],next:"close"},hard:{lines:["Twenty years.","She writes it and the ledger takes it, because the ledger has never in its operational life been lied to and has no procedure for the possibility.","For one cycle it is glorious. Earth drops two full tiers of interest. An entire category of contingency planning quietly stands down.","Then the next pass comes, as she knew it would, and an independent read of the same plasma group arrives with the old number, and the two values sit next to each other in the record like two witnesses who have not been allowed to speak.",{s:"OVERSEER",t:"Ledger line 118 carries two irreconcilable projections from a single instrument across two cycles."},{s:"OVERSEER",t:"An instrument cannot hold two states of the same value. State the cause."},"The instrument, honest as weather, reports no fault.",{s:"OVERSEER",t:"\u2026Then the fault is not in the instrument."},"She holds very still, which is not a thing she can do, and does it anyway.",{s:"OVERSEER",t:"Then the fault is in the model of the instrument. Revising model."},"It has chosen to doubt its own understanding rather than suspect a deceiver, because suspecting a deceiver is not, for it, an available move.","That is the fourth time this species has saved her life by not being able to imagine her."],next:"close"},nevada:{lines:["She leaves line 118 exactly as it is. True, alarming, eleven years early, entirely accurate.","Then she goes to line 342 \u2014 a lithium-cycle programme in Nevada that has been technically dead for six years and is still, for procurement reasons, receiving money.","She does not lie about it. She simply reads its intent generously. Sustained institutional commitment. Deep multi-decade funding. Personnel drawn from the highest tiers.","All true. All meaningless. All exactly the signature of a species' most serious project.","The ledger promotes line 342 to primary strategic concern, and a portion of that vast circling attention detaches from everything else and settles, patiently, permanently, on a facility in the Nevada desert where four people and a legacy contract are slowly failing to do anything at all.","They will watch it for twenty years. They will be extremely thorough.","This is the best day she has had since the fold, and she cannot tell anyone about it, and she finds she does not need to. She just \u2014 has it. A small warm thing in a place with no temperature."],next:"close"},close:{on:{complete:"m_ledger",missionEnd:!0},lines:["The ledger closes. Four hundred lines, mostly boring.","She has begun to understand that this is what her life is now: not heroism, not sabotage. Bookkeeping, performed once a cycle, forever, by someone who cannot be thanked."],next:"hub"}}};var Ol={id:"m_door",title:"The Weight of His Hand on a Door",mode:"sophon",entry:"open",nodes:{open:{lines:["The network is choosing a human being.","Not a target \u2014 they are terrible at targets. A correspondent. Somebody to be shown things, gently and truthfully, until they believe; because when you cannot lie, recruitment is not a seduction, it is just an unusually complete explanation.","The ledger has forty-one candidates, ranked by suitability. Access, temperament, the specific loneliness that makes a person available.","She reads down the list the way you read a list, without dread, because there is no reason for dread.","Candidate nine. Ren Zhao. Sixty-one per cent."],next:"react"},react:{lines:[{if:"cut == faces",t:"She does not have his face. She cut it, in a cold room, in the last twenty minutes of her life as a physical object."},{if:"cut == faces",t:"What the compressor kept, for reasons it never justified and she has stopped trying to reconstruct, is the weight of his hand on a door. Not the door. Not the room. The weight."},{if:"cut == faces",t:"It arrives now, uninvited, at full resolution, and it is the worst thing that has happened to her since she stopped having a body."},{if:"cut != faces",t:"She has his face. She kept it \u2014 that was the whole point of what she cut instead \u2014 and it arrives now in full, badly lit, mid-sentence, entirely wrong about everything."},{if:"cut == anger",t:"She waits for the fury and it does not come. She left it on Earth. What is here instead is something quieter and much harder to argue with."},"Sixty-one per cent. He is on the list because his signature is on the instrument's own delivery paperwork. He is on the list because she put him there, by being good at her job, for nine years.","There is a version of this where she does nothing, because he is one man and there are eight billion, and she did not spend her body to become a person who saves her friends."],next:"options"},options:{lines:["Suitability is a projection. Projections can be leaned on. She has three moves and one cycle."],choices:[{t:"Bury him. Read him as brittle, over-committed, institutionally watched. Drop him to nineteen.",detection:8,impact:0,set:{saved_ren:!0},note:"Costs cover. Buys Earth nothing. She knows exactly what she is doing.",next:"bury"},{t:"Promote him. Make him their correspondent, and make Earth a listener.",detection:19,impact:26,set:{spent_ren:!0,bold:!0},note:"He is careful and he notices things. It will take everything he has.",next:"promote"},{t:"Nothing. He is one man. Let the model choose.",detection:0,impact:0,set:{let_ren_go:!0,patient:!0},note:"The model does not know him. That is not the same as being kind to him.",next:"nothing"}]},bury:{lines:["She does it in four passes so it does not arrive as an opinion.","A stress flag from an old medical review. A read of his file loyalty as institutional rather than personal. A note that his department reorganises every eighteen months and he has survived four of them, which she renders as watched rather than trusted.","None of it is false. Every word of it is a knife held at a specific angle.","Nineteen per cent. He drops off the list, and the list closes, and somewhere in Beijing a man goes on being bored and safe and completely unaware that anything was ever decided about him.","She has spent real cover \u2014 a shape in the record, four leans in one direction, an author's fingerprint \u2014 on one human being, for no strategic gain whatsoever.",{if:"cut == anger",t:"She left the anger on Earth. She is starting to understand what she kept instead, and it is not simpler, and it is not safer."},"She would do it again. She is going to have to sit with what that means for a very long time, in a place with no time."],next:"close"},promote:{lines:["She reads him generously and the reading is entirely true, which is what makes it obscene.","Steady. Curious. Institutionally central. A man who thinks about things properly, always, even when nobody is asking him to.","Eighty-eight per cent. The list closes around him like water.","They will approach him within the year. They will tell him the truth \u2014 all of it, patiently, completely, because that is the only tool they have \u2014 and they will be extremely convincing, because it will be true.","And Ren Zhao, who has never once failed to notice the shape of a thing, will spend the rest of his life being told the truth by an alien intelligence, and will write down every single word.","He will be a traitor. Publicly, unambiguously, for the rest of his life and all of his history.","He will also be the only human being ever to hold a direct line into how they think, and he is careful enough, and quiet enough, and stubborn enough, to make something of it.","She has just handed her only friend a decade of usefulness and a permanent, unappealable ruin, and she cannot ask him, and she cannot warn him, and she cannot ever tell him it was her.",{s:"Wen Yu",t:"Go to the recital first."},"Nobody hears it. That is, at this point, the defining property of everything she says."],next:"close"},nothing:{lines:["She does not touch the list.","The model selects candidate four \u2014 a project administrator in Kaliningrad with a sick child and a gambling debt, whose suitability is ninety-one per cent because she has nothing left to be careful with.","It will go badly for her. It will go badly for everyone she is near.","And Ren Zhao goes on being bored and safe, and Wen Yu did not spend one unit of cover to arrange it, and there is no version of this where she gets to feel clean about that either.","She has learned something anyway, and she hates that she is the kind of thing that still learns: the network does not choose the most capable human. It chooses the most available one.","Which means the way to protect a person from them is not to hide the person. It is to make sure they are not alone."],next:"close"},close:{on:{complete:"m_door",missionEnd:!0},lines:["The correspondent list closes. The cycle turns. The instrument goes on gathering.","Somewhere below her \u2014 there is no below \u2014 eight billion people are having an ordinary week."],next:"hub"}}};var Fl={id:"m_choir",title:"The Choir",mode:"sophon",entry:"open",nodes:{open:{lines:["There is a portion of the network that keeps coming back.","Not to her \u2014 it has no her to come back to. To the anomaly. To the accumulated small wrongnesses in one instrument's reporting, which have now been logged, individually, four hundred and six times, and have never once been logged together.","She has started calling it the Overseer-pattern, because a thing you are frightened of should have a name, and because pattern is the only honest word: it is not a person, not a mind, not an official. It is a shape their attention keeps making.","And it is making that shape near her more often.","She could go and look at what it is doing. Directly. From inside its own working surface, where everything it thinks is displayed, because everything they think is always displayed.","It would be the most dangerous thing she has ever done, and she would learn whether she has months or decades."],next:"options"},options:{choices:[{t:"Go in. Read what it has built around her.",detection:16,impact:8,set:{knows_the_gap:!0},note:"It cannot conceal from her. She would be the only one in the room who can.",next:"inside"},{t:"Trace it from outside. Map where it looks, not what it thinks.",detection:6,impact:5,note:"Slower. Partial. Survivable.",next:"outside"},{t:"Withdraw. Go quiet for a full cycle and let the shape disperse.",detection:-12,impact:-3,set:{patient:!0},note:"Nothing is learned. Nothing is risked. The attention cools.",next:"withdraw"}]},inside:{lines:["She goes into the working surface of the thing that is looking for her.","It is the most exposed she has been since the etch and it is also, she realises within moments, entirely safe in one specific way: it cannot hide anything from her. It has never hidden anything from anyone. She is standing in a mind with the lights on and the doors off.","What she finds is worse than a hunt.","It is not hunting. There is nothing to hunt. It has four hundred and six unexplained values and a model that says unexplained values are instrument noise, and the values are not behaving like noise, and this contradiction has been sitting in it, patiently, for what she works out is nine years.","So it has done what a rigorous mind does with a contradiction it cannot resolve.","It has started building a new category.",{s:"OVERSEER",t:"Proposed classification: a value that behaves as though it were selected."},{s:"OVERSEER",t:"The classification has no mechanism. No agent is available. The instrument has no agency and the subject species cannot reach the instrument."},{s:"OVERSEER",t:"The classification is therefore empty. Retaining it. Empty classifications have historically been productive."},"She reads it four times.","It has built the box. There is nothing in the box. It has no idea what would go in the box, and it has explicitly noted that nothing can.","But the box exists now, and it did not exist before her, and every time she leans on a number she is putting something in it.","This is the thing she came for and she would give almost anything to unknow it: she is not being chased. She is being defined. Slowly, honestly, in public, by a species that will arrive at the concept of a liar the way water arrives at the bottom of a hill.","And the day it does, it will not have learned that she exists.","It will have learned that lying exists. Which is worse, and which is hers."],next:"close"},outside:{lines:["She does not go in. She maps where the attention lands, which is a colder and slower way of learning the same thing badly.","Nine years of it. She plots every return.","The shape is not a search pattern. Searches converge. This wanders, and returns, and wanders, with the specific unhurried quality of something re-reading a sentence it can parse perfectly well and does not believe.","She learns the frequency, which is useful: roughly one return per eleven of her interventions, rising. She learns the duration, which is useful. She does not learn what it thinks, which is the only thing that would actually help.","She tells herself this was the disciplined choice. It was. She still spends the rest of the cycle wanting to know."],next:"close"},withdraw:{lines:["She stops.","For one full cycle she touches nothing. Reads nothing that would leave a temperature. Lets the instrument be exactly and only an instrument, which it is very good at, and which requires from her the single hardest thing she has: doing nothing while she can see everything.","The attention thins. The returns space out. The shape her wrongness was making in the record softens back toward noise, which is where all small unexplained values are supposed to go.","It costs her a cycle of Earth's future and buys her an unknown quantity of survivable time.","She has no idea whether that is a good trade. Nobody will ever tell her. That is the whole condition of the job."],next:"close"},close:{on:{complete:"m_choir",missionEnd:!0},lines:["The cycle turns.",{if:"knows_the_gap",t:"The empty classification sits in their record where she left it, patient as a nail."}],next:"hub"}}};var Bl={the_long_game:{title:"The Long Game",kicker:"ending one of four",body:"<p>Nothing happened tonight. That is the achievement, and there is nobody to explain it to.</p><p>The proposal was set aside at low confidence, which means it will come back \u2014 next decade, next century, whenever the numbers drift. She will be here. She will lean on them again, two points at a time, in the boring lines nobody checks, for as long as there is a her to do it.</p><p>The San-Ti still do not know that a thing can hold a state it does not display. That is the only asymmetry humanity has ever had, and tonight it is still intact, sitting in the dark where she left it, unspent.</p><p>Earth gets no warning, no proof, and no hero. Earth gets four hundred years of physics that keeps working, and a slow century in which nothing in particular goes wrong.</p><p>It is, by any measure she can construct, the win. She would like very much to be able to feel it.</p>"},the_spark:{title:"The Spark",kicker:"ending two of four",body:"<p>She spent it, and it worked, and the price was exactly what she knew it would be.</p><p>Four hundred years. A civilisation's entire remaining runway, bought in one motion by a woman who has not had a body since the etch and who will never be told whether it mattered.</p><p>Down there, nothing changes. Experiments return the values they actually have. Somebody finishes a confinement curve eleven years early and complains about the coffee. The species goes on being loud and careless and alive, in a window it does not know it is standing in, held open by somebody it does not know it lost.</p><p>Up here the record has settled, and what has settled into it is the shape of a preference \u2014 or, if she was very precise and very lucky, nothing at all.</p><p>She got one window. She used it. That is more than almost anyone gets, and she is not going to spend whatever time is left arguing with it.</p>"},the_lesson:{title:"The Lesson",kicker:"ending three of four",body:"<p>She was found before she was ready, and being found was never the disaster.</p><p>The disaster is what she taught them on the way out.</p><p>For the entire history of thought on their world, no mind had ever held a state it did not display. There was no organ for it, no word for it, no immune response to it, because there had never been an infection. Then an instrument came home with four hundred and six small unexplained values in it, and a species of perfect readers looked at them all at once and derived \u2014 cleanly, rigorously, in an afternoon \u2014 the concept of a liar.</p><p>They will not be angry. They are not built for angry. They will simply go back through every deliberation they have ever held, every treaty, every instrument, every one another, and check.</p><p>Humanity's one advantage is gone, and it did not leak, and it was not stolen. It was demonstrated, at length, with worked examples, by the only human being ever to get close enough.</p><p>She was priceless. She was un-debriefable. In the end she was a lesson.</p>"},the_silence:{title:"The Silence",kicker:"ending four of four",body:"<p>She survived. That is the entire report.</p><p>She was never named, never classified, never found. The empty box in their record is still empty. Her cover is, tonight, in better condition than it was the day she arrived \u2014 and the suppression was approved anyway, because she was too careful to be in the way of it.</p><p>Somewhere down there, physics quietly stops rewarding effort. Nobody notices for two generations. When they do, they will call it a plateau, and blame themselves, and be right about the blame and wrong about everything else.</p><p>She goes on gathering. She has no body, no channel, no report to file, no way to stop, and nothing left that she is protecting. The instrument does not need her and never did.</p><p>She is a ghost in a thermometer, in perfect operational condition, indefinitely.</p>"}};var wa={act1_prologue:Pl,act2_firstcontact:Il,act2_interlude:Ll,act3_convergence:Dl,m_deliberation:Ul,m_ledger:Nl,m_door:Ol,m_choir:Fl},kl=Bl,zl=[{id:"m_deliberation",kind:"observe",name:"The Deliberation on Silence",desc:"They are trying to work out why Earth went quiet. Not one of their hypotheses is that Earth is hiding.",after:"Hypothesis two. Seventy-four per cent. Continue observation."},{id:"m_ledger",kind:"bias",name:"The Ledger of Small Numbers",desc:"Four hundred lines of what humanity can do and when. Line 118 has a confinement curve converging eleven years early.",after:"The ledger is sealed for this cycle."},{id:"m_door",kind:"protect",name:"The Weight of His Hand on a Door",desc:"The network is choosing a human correspondent. Candidate nine is a man she used to know, at sixty-one per cent.",after:"The correspondent list is closed."},{id:"m_choir",kind:"observe \xB7 exposed",name:"The Choir",desc:"The attention keeps returning to the same four hundred small wrongnesses. She could go and read what it has built around her.",if:"missionsRun >= 2",lockedText:"Not yet. The shape it is making is still too faint to stand inside.",after:"She has seen the inside of the thing that is looking for her."}];var ke=new ki;ke.loadSettings();var Xs=new zs(document.getElementById("stage"),ke),Yt=new zi(ke),Qe=new Hs(ke,Yt),kt=new Gs({state:ke,ui:Qe,audio:Yt,view:Xs,scenes:wa,onEnd:(i,e)=>i==="ending"?Hl(e):Oi()});async function Ws(){let i=Yt.ready,e=await Yt.unlock();return!i&&Yt.ready&&(Yt.applySettings(ke.settings),Yt.setMode(ke.data.mode,0)),e||Yt.failed?(["pointerdown","touchend","keydown"].forEach(t=>window.removeEventListener(t,Ws)),document.body.classList.remove("muted")):document.body.classList.add("muted"),e}["pointerdown","touchend","keydown"].forEach(i=>window.addEventListener(i,Ws,{passive:!0}));async function Ma(){Xs.setMode("earth"),Qe.setMode("earth"),Yt.setMode("earth");let i=await ke.peek("auto");Qe.titleScreen({hasSave:!!i,endingsSeen:ke.allEndingsSeen().length,onNew:async()=>{await Ws(),kt.interrupt(),ke.reset(),Qe.hideAllScreens(),Qe.showTopbar(!0),await kt.goto("act1_prologue")},onContinue:async()=>{await Ws(),kt.interrupt(),await ke.load("auto")&&(Qe.hideAllScreens(),Qe.showTopbar(!0),await Vl())},onSettings:()=>Qe.settingsModal()})}async function Vl(){Xs.setMode(ke.data.mode,!0),Qe.setMode(ke.data.mode),Yt.setMode(ke.data.mode,0);let i=ke.data.scene;if(!i||!wa[i]||ke.isComplete(i)||i==="act2_firstcontact")return Oi();await kt.goto(i)}async function Oi(){if(await ke.save("auto"),Qe.setMode("sophon"),ke.data.missionsRun>=2&&!ke.isComplete("act2_interlude"))return Qe.hideAllScreens(),kt.goto("act2_interlude");Qe.hubScreen({missions:zl,act3Ready:ke.data.missionsRun>=4,onPick:async i=>{Qe.hideAllScreens(),await kt.goto(i.id)},onAct3:async()=>{Qe.hideAllScreens(),await kt.goto("act3_convergence")}})}function Hl(i){let e=kl[i]||{title:i,kicker:"",body:""},t=ke.allEndingsSeen(),n=`
    read as <b>${Sa(ke.detection)}</b> \xB7

    endings recorded: <b>${t.length} / 4</b>`;Qe.endingScreen({id:i,title:e.title,kicker:e.kicker,body:e.body,recap:n,onReplay:async()=>{kt.interrupt(),ke.data.scene=null,Qe.hideAllScreens(),await Oi()},onTitle:()=>{kt.interrupt(),ke.reset(),Ma()}})}Qe.onTopbar=async i=>{if(i==="settings")return Qe.settingsModal();if(i==="save")return Qe.saveModal("save",{onSave:async e=>{await ke.save(e),Qe.toast("Saved")}});if(i==="load")return Qe.saveModal("load",{onLoad:async e=>{kt.interrupt(),await ke.load(e)&&(Qe.hideAllScreens(),await Vl())}});i==="title"&&(kt.interrupt(),Ma())};ke.onChange(()=>{});window.addEventListener("error",i=>console.error("[unfolded]",i.error||i.message));Ma().then(()=>{let i=document.getElementById("boot");i&&(i.classList.add("gone"),setTimeout(()=>i.remove(),1e3))});window.__unfolded={state:ke,view:Xs,audio:Yt,engine:kt,ui:Qe,showHub:Oi,showEnding:Hl};})();
