<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNFOLDED</title>
<meta name="description" content="A visual novel. A physicist who smuggled her own mind into an alien surveillance instrument must spy on a species that has never needed to lie.">
<meta name="color-scheme" content="dark">
<style>
:root {
--ink: #e8e2d8;
--ink-dim: #9c968c;
--accent: #d8a05a;
--accent-soft: rgba(216, 160, 90, 0.35);
--panel: rgba(12, 10, 9, 0.78);
--panel-edge: rgba(216, 160, 90, 0.22);
--choice-bg: rgba(18, 15, 13, 0.72);
--serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
Georgia, "Times New Roman", serif;
--sans: "Inter", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI",
Roboto, Arial, sans-serif;
--mono: "SF Mono", "JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
--fade: 520ms;
}
body[data-mode="sophon"] {
--ink: #dceaf2;
--ink-dim: #7e97a6;
--accent: #7fd4ff;
--accent-soft: rgba(127, 212, 255, 0.32);
--panel: rgba(6, 12, 17, 0.72);
--panel-edge: rgba(127, 212, 255, 0.24);
--choice-bg: rgba(8, 16, 22, 0.66);
}
* { box-sizing: border-box; }
html, body {
margin: 0; padding: 0;
height: 100%;
height: 100dvh;            
background: #05070a; color: var(--ink);
font-family: var(--sans);
overflow: hidden;
overscroll-behavior: none;  
-webkit-font-smoothing: antialiased;
-webkit-tap-highlight-color: transparent;
-webkit-text-size-adjust: 100%;
}

button, #dialogue, .choice, .mission, .slot, .menu-item, .tb { touch-action: manipulation; }
#stage {
position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0;
}

body.no-webgl #stage { display: none; }
body.no-webgl {
background:
radial-gradient(ellipse at 60% 35%, rgba(72, 52, 34, 0.55), transparent 60%),
radial-gradient(ellipse at 30% 80%, rgba(24, 20, 16, 0.8), transparent 65%),
#070705;
}
body.no-webgl[data-mode="sophon"] {
background:
radial-gradient(ellipse at 50% 40%, rgba(28, 62, 88, 0.55), transparent 62%),
radial-gradient(ellipse at 20% 85%, rgba(10, 22, 32, 0.85), transparent 60%),
#04070b;
}
#ui {
position: fixed; inset: 0; z-index: 1;
display: flex; flex-direction: column; justify-content: flex-end;
pointer-events: none;
}
#ui > * { pointer-events: auto; }

#dialogue-wrap {
position: absolute; left: 0; right: 0; bottom: 0;
padding: 0 calc(clamp(16px, 5vw, 84px) + env(safe-area-inset-right, 0px))
calc(clamp(18px, 4vh, 46px) + env(safe-area-inset-bottom, 0px))
calc(clamp(16px, 5vw, 84px) + env(safe-area-inset-left, 0px));
display: flex; flex-direction: column; align-items: center;
transition: opacity var(--fade) ease;
}
#dialogue-wrap.hidden { opacity: 0; pointer-events: none; }
#dialogue {
width: min(920px, 100%);
background: var(--panel);
border: 1px solid var(--panel-edge);
border-radius: 3px;
backdrop-filter: blur(9px) saturate(0.9);
-webkit-backdrop-filter: blur(9px) saturate(0.9);
padding: clamp(18px, 2.6vw, 30px) clamp(20px, 3vw, 38px) clamp(22px, 3vw, 32px);
box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
position: relative;
cursor: pointer;
min-height: 8.5em;
}
#speaker {
font-family: var(--sans);
font-size: clamp(11px, 1.1vw, 13px);
letter-spacing: 0.22em;
text-transform: uppercase;
color: var(--accent);
margin-bottom: 12px;
min-height: 1.2em;
opacity: 0.95;
}
#speaker:empty::before { content: "\00a0"; }
#text {
font-family: var(--serif);
font-size: clamp(17px, 1.55vw, 21px);
line-height: 1.72;
color: var(--ink);
min-height: 4.6em;
white-space: pre-wrap;
}
#text .caret {
display: inline-block; width: 0.42em; height: 1.05em;
background: var(--accent); opacity: 0.55; vertical-align: -0.15em;
animation: blink 1.1s steps(2, end) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
#dialogue.narration #text { color: var(--ink-dim); font-style: italic; }
#dialogue.overseer #text {
font-family: var(--mono);
font-size: clamp(15px, 1.35vw, 18px);
letter-spacing: 0.04em;
color: #cfe9f7;
text-shadow: 0 0 22px rgba(127, 212, 255, 0.35);
}
#dialogue.overseer { border-color: rgba(127, 212, 255, 0.4); }
#dialogue.wen #text { color: #f2ece1; }
#advance {
position: absolute; right: 16px; bottom: 10px;
color: var(--accent); font-size: 13px; opacity: 0;
transition: opacity 220ms ease;
animation: nudge 1.6s ease-in-out infinite;
}
#advance.on { opacity: 0.75; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

#choices {
width: min(760px, 100%);
display: flex; flex-direction: column; gap: 10px;
margin-bottom: 16px;
}
#choices:empty { display: none; }
.choice {
font-family: var(--serif);
font-size: clamp(15px, 1.3vw, 18px);
line-height: 1.5;
text-align: left;
color: var(--ink);
background: var(--choice-bg);
border: 1px solid var(--panel-edge);
border-left: 2px solid var(--accent-soft);
border-radius: 2px;
padding: 13px 18px;
cursor: pointer;
backdrop-filter: blur(6px);
-webkit-backdrop-filter: blur(6px);
transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
opacity: 0; transform: translateY(6px);
animation: rise 380ms ease forwards;
}
.choice:hover, .choice:focus-visible {
border-left-color: var(--accent);
background: rgba(40, 32, 24, 0.8);
transform: translateX(3px);
outline: none;
}
body[data-mode="sophon"] .choice:hover,
body[data-mode="sophon"] .choice:focus-visible { background: rgba(16, 32, 44, 0.8); }
.choice .note {
display: block; margin-top: 6px;
font-family: var(--sans); font-size: 12px; letter-spacing: 0.04em;
color: var(--ink-dim); font-style: italic;
}
@keyframes rise { to { opacity: 1; transform: translateY(0); } }

#chapter-card {
position: fixed; inset: 0; z-index: 4;
display: flex; flex-direction: column; align-items: center; justify-content: center;
background: rgba(3, 5, 7, 0.86);
opacity: 0; pointer-events: none;
transition: opacity 700ms ease;
text-align: center;
}
#chapter-card.on { opacity: 1; }
#chapter-card h2 {
font-family: var(--serif); font-weight: 400;
font-size: clamp(26px, 4vw, 46px); letter-spacing: 0.06em;
margin: 0 0 14px; color: var(--ink);
}
#chapter-card p {
font-family: var(--sans); font-size: clamp(11px, 1.1vw, 13px);
letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent);
margin: 0;
}

#topbar {
position: fixed; top: 0; left: 0; right: 0; z-index: 3;
display: flex; gap: 6px; justify-content: flex-end;
padding: calc(14px + env(safe-area-inset-top, 0px))
calc(clamp(14px, 3vw, 28px) + env(safe-area-inset-right, 0px))
14px
calc(clamp(14px, 3vw, 28px) + env(safe-area-inset-left, 0px));
transition: opacity 300ms ease;
pointer-events: none;
}
#topbar .tb { pointer-events: auto; }
#topbar.hidden { opacity: 0; pointer-events: none; }
.tb {
font-family: var(--sans); font-size: 11px; letter-spacing: 0.18em;
text-transform: uppercase; color: var(--ink-dim);
background: rgba(8, 8, 10, 0.5); border: 1px solid rgba(255, 255, 255, 0.09);
border-radius: 2px; padding: 7px 13px; cursor: pointer;
transition: color 160ms ease, border-color 160ms ease;
}
.tb:hover { color: var(--ink); border-color: var(--panel-edge); }

.screen {
position: fixed; inset: 0; z-index: 5;
display: flex; flex-direction: column; align-items: center; justify-content: center;
padding: clamp(24px, 6vh, 70px) clamp(18px, 6vw, 90px);
background: radial-gradient(ellipse at 50% 45%, rgba(4, 6, 9, 0.55), rgba(3, 4, 6, 0.94));
opacity: 0; pointer-events: none; transition: opacity 700ms ease;
overflow-y: auto;
}
.screen.on { opacity: 1; pointer-events: auto; }
#screen-title h1 {
font-family: var(--serif); font-weight: 400;
font-size: clamp(44px, 10vw, 118px);
letter-spacing: 0.30em; margin: 0 0 6px 0.30em;
color: #f0e9dd;
text-shadow: 0 0 60px rgba(216, 160, 90, 0.28);
}
#screen-title .tag {
font-family: var(--sans); font-size: clamp(10px, 1.05vw, 12px);
letter-spacing: 0.42em; text-transform: uppercase;
color: var(--accent); margin: 0 0 clamp(26px, 5vh, 52px) 0.42em;
}
#screen-title .menu { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.menu-item {
font-family: var(--sans); font-size: 13px; letter-spacing: 0.26em;
text-transform: uppercase; color: var(--ink-dim);
background: none; border: none; padding: 11px 24px; cursor: pointer;
transition: color 200ms ease, letter-spacing 200ms ease;
}
.menu-item:hover:not(:disabled) { color: var(--ink); letter-spacing: 0.32em; }
.menu-item:disabled { opacity: 0.28; cursor: default; }
#screen-title .foot {
position: absolute; bottom: 20px; left: 0; right: 0; text-align: center;
font-size: 10.5px; letter-spacing: 0.18em; line-height: 2;
color: rgba(255, 255, 255, 0.22);
}

#screen-hub { justify-content: flex-start; }
#screen-hub .hub-inner { width: min(860px, 100%); margin: auto 0; }
#screen-hub h2 {
font-family: var(--serif); font-weight: 400; font-size: clamp(22px, 3vw, 34px);
margin: 0 0 6px; letter-spacing: 0.05em;
}
#screen-hub .hub-state {
font-family: var(--serif); font-style: italic; color: var(--ink-dim);
font-size: clamp(14px, 1.35vw, 17px); line-height: 1.7;
margin: 0 0 clamp(18px, 3vh, 34px); max-width: 62ch;
}
.mission {
display: block; width: 100%; text-align: left;
background: var(--choice-bg); border: 1px solid var(--panel-edge);
border-left: 2px solid var(--accent-soft);
padding: 15px 20px; margin-bottom: 10px; cursor: pointer;
transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
}
.mission:hover:not(:disabled) {
transform: translateX(4px); border-left-color: var(--accent);
background: rgba(16, 30, 40, 0.78);
}
.mission:disabled { opacity: 0.35; cursor: default; }
.mission .kind {
font-family: var(--sans); font-size: 10px; letter-spacing: 0.28em;
text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 7px;
}
.mission .name {
font-family: var(--serif); font-size: clamp(16px, 1.5vw, 20px); display: block;
}
.mission .desc {
font-family: var(--sans); font-size: 12.5px; color: var(--ink-dim);
display: block; margin-top: 7px; line-height: 1.6;
}
.mission.done .name { text-decoration: line-through; text-decoration-thickness: 1px; }

#screen-ending .end-inner { width: min(720px, 100%); text-align: center; }
#screen-ending .end-kicker {
font-family: var(--sans); font-size: 11px; letter-spacing: 0.4em;
text-transform: uppercase; color: var(--accent); margin-bottom: 16px;
}
#screen-ending h2 {
font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 5vw, 54px);
margin: 0 0 22px; letter-spacing: 0.1em;
}
#screen-ending .end-body {
font-family: var(--serif); font-size: clamp(15px, 1.4vw, 18px); line-height: 1.85;
color: var(--ink-dim); margin-bottom: 26px; text-align: left;
}
#screen-ending .recap {
font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.05em;
color: rgba(255, 255, 255, 0.32); line-height: 2; margin-bottom: 28px;
border-top: 1px solid rgba(255, 255, 255, 0.09);
border-bottom: 1px solid rgba(255, 255, 255, 0.09);
padding: 16px 0;
}
#screen-ending .recap b { color: var(--accent); font-weight: 400; }

#modal {
position: fixed; inset: 0; z-index: 6;
display: flex; align-items: center; justify-content: center;
background: rgba(2, 3, 5, 0.7); backdrop-filter: blur(4px);
opacity: 0; pointer-events: none; transition: opacity 300ms ease;
padding: 20px;
}
#modal.on { opacity: 1; pointer-events: auto; }
.modal-box {
width: min(520px, 100%); max-height: 86vh; overflow-y: auto;
background: rgba(10, 10, 12, 0.94);
border: 1px solid var(--panel-edge); padding: 28px 30px 24px;
}
.modal-box h3 {
font-family: var(--sans); font-size: 12px; letter-spacing: 0.3em;
text-transform: uppercase; color: var(--accent); margin: 0 0 22px;
}
.row { margin-bottom: 20px; }
.row label {
display: flex; justify-content: space-between; align-items: baseline;
font-family: var(--sans); font-size: 12.5px; letter-spacing: 0.06em;
color: var(--ink); margin-bottom: 9px;
}
.row label span { color: var(--ink-dim); font-family: var(--mono); font-size: 11px; }
.row .hint {
font-size: 11.5px; color: var(--ink-dim); line-height: 1.55; margin-top: 6px;
font-style: italic;
}
input[type="range"] {
width: 100%; appearance: none; height: 2px; background: rgba(255, 255, 255, 0.16);
outline: none;
}
input[type="range"]::-webkit-slider-thumb {
appearance: none; width: 13px; height: 13px; border-radius: 50%;
background: var(--accent); cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
width: 13px; height: 13px; border-radius: 50%; border: none;
background: var(--accent); cursor: pointer;
}
.toggle {
display: flex; justify-content: space-between; align-items: center;
cursor: pointer; font-family: var(--sans); font-size: 12.5px; color: var(--ink);
}
.toggle .sw {
width: 40px; height: 20px; border: 1px solid var(--panel-edge);
border-radius: 10px; position: relative; transition: background 200ms ease;
}
.toggle .sw::after {
content: ""; position: absolute; top: 2px; left: 2px;
width: 14px; height: 14px; border-radius: 50%;
background: var(--ink-dim); transition: transform 200ms ease, background 200ms ease;
}
.toggle.on .sw { background: var(--accent-soft); }
.toggle.on .sw::after { transform: translateX(20px); background: var(--accent); }
.modal-box.about { text-align: left; }
.about-title {
font-family: var(--serif); font-size: clamp(24px, 3vw, 32px);
letter-spacing: 0.24em; margin: 0 0 4px; color: var(--ink);
}
.about-line {
font-family: var(--serif); font-size: 14.5px; line-height: 1.75;
color: var(--ink-dim); margin: 0 0 20px;
}
.about-line.small { font-family: var(--sans); font-size: 12px; line-height: 1.7; margin-bottom: 4px; }
.about-credit {
font-family: var(--mono); font-size: 12px; line-height: 2;
color: var(--ink); margin: 0 0 20px;
border-top: 1px solid rgba(255, 255, 255, 0.09);
border-bottom: 1px solid rgba(255, 255, 255, 0.09);
padding: 14px 0;
}
.about-credit a {
color: var(--accent); text-decoration: none;
border-bottom: 1px solid var(--accent-soft);
transition: border-color 160ms ease;
}
.about-credit a:hover { border-bottom-color: var(--accent); }
.slot {
display: flex; justify-content: space-between; align-items: center;
width: 100%; text-align: left; background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.08); padding: 12px 15px;
margin-bottom: 8px; cursor: pointer; color: var(--ink);
font-family: var(--sans); font-size: 12.5px;
transition: border-color 160ms ease, background 160ms ease;
}
.slot:hover:not(:disabled) { border-color: var(--accent-soft); background: rgba(255, 255, 255, 0.06); }
.slot:disabled { opacity: 0.3; cursor: default; }
.slot .meta { color: var(--ink-dim); font-family: var(--mono); font-size: 10.5px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

#boot {
position: fixed; inset: 0; z-index: 9; background: #05070a;
display: flex; align-items: center; justify-content: center;
color: var(--ink-dim); font-family: var(--sans); font-size: 11px;
letter-spacing: 0.34em; text-transform: uppercase;
transition: opacity 900ms ease;
}
#boot.gone { opacity: 0; pointer-events: none; }
.sr-only {
position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

#sound-hint {
position: fixed; z-index: 7;
left: 50%; transform: translateX(-50%);
bottom: calc(12px + env(safe-area-inset-bottom, 0px));
display: none;
font-family: var(--sans); font-size: 10.5px; letter-spacing: 0.22em;
text-transform: uppercase; color: var(--accent);
background: rgba(8, 8, 10, 0.82);
border: 1px solid var(--panel-edge); border-radius: 2px;
padding: 8px 14px; pointer-events: none;
}
body.muted #sound-hint { display: block; }

@media (pointer: coarse) {

#dialogue, .choice, .mission {
backdrop-filter: none; -webkit-backdrop-filter: none;
}
#dialogue { background: rgba(10, 9, 8, 0.90); }
body[data-mode="sophon"] #dialogue { background: rgba(5, 11, 16, 0.90); }
.choice, .mission { background: rgba(12, 11, 10, 0.90); }
body[data-mode="sophon"] .choice,
body[data-mode="sophon"] .mission { background: rgba(7, 15, 21, 0.90); }

.tb { padding: 12px 15px; font-size: 11.5px; }
.menu-item { padding: 15px 26px; font-size: 14px; }
.choice { padding: 15px 18px; }
.mission { padding: 17px 18px; }
.slot { padding: 15px 15px; }
input[type="range"] { height: 22px; background: none; }
input[type="range"]::-webkit-slider-thumb { width: 20px; height: 20px; }
input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; }
.row { margin-bottom: 24px; }

.choice:hover, .mission:hover:not(:disabled) { transform: none; }
}

@media (max-width: 700px) {
#dialogue { min-height: 9.5em; padding: 16px 18px 24px; }
#text { min-height: 5.2em; font-size: 16.5px; line-height: 1.65; }
#speaker { font-size: 10px; margin-bottom: 9px; }
#choices { margin-bottom: 12px; gap: 8px; }
#topbar { gap: 4px; }
.tb { padding: 10px 11px; font-size: 10px; letter-spacing: 0.12em; }
#screen-title h1 { letter-spacing: 0.18em; margin-left: 0.18em; }
#screen-title .tag { letter-spacing: 0.24em; margin-left: 0.24em; }
#screen-hub .hub-inner { padding-top: 56px; }
.modal-box { padding: 22px 20px 18px; }
}

@media (max-height: 500px) {
#dialogue { min-height: 0; padding: 12px 18px 22px; }
#text { min-height: 3.1em; font-size: 15.5px; line-height: 1.55; }
#dialogue-wrap { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
#choices { margin-bottom: 8px; gap: 6px; }
.choice { padding: 9px 14px; font-size: 14px; }
.choice .note { margin-top: 3px; font-size: 11px; }
#screen-title h1 { font-size: clamp(30px, 8vw, 54px); }
#screen-title .tag { margin-bottom: 14px; }
.menu-item { padding: 8px 22px; }
#chapter-card h2 { font-size: clamp(22px, 5vw, 32px); }
.screen { padding: 18px 22px; }
#screen-hub .hub-state { margin-bottom: 14px; }
.mission { padding: 11px 16px; margin-bottom: 7px; }
.mission .desc { display: none; }
}

@media (pointer: coarse) {
.tb, .menu-item, .slot, .choice, .mission {
min-height: 44px;
display: flex;
align-items: center;
}
.tb { justify-content: center; }
.menu-item { justify-content: center; }
.choice, .mission { flex-direction: column; align-items: stretch; justify-content: center; }
.slot { justify-content: space-between; }
#screen-title .menu { width: 100%; align-items: stretch; }
}
</style>
</head>
<body data-mode="earth">
<canvas id="stage"></canvas>
<div id="ui"></div>
<div id="boot">unfolding</div>
<noscript>
  <p style="color:#e8e2d8;font-family:serif;padding:3rem;max-width:40ch;margin:auto">
    UNFOLDED needs JavaScript and WebGL. It is a rendered thing; there is no text-only mode.
